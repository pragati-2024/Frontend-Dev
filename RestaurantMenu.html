<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">
    <h1 class="text-center mb-4">Today's Menu</h1>

    <!-- Menu Table -->
    <table class="table table-striped">
        <thead>
        <tr><th>Item</th><th>Category</th><th>Price</th></tr>
        </thead>
        <tbody>
        <tr><td>Margherita Pizza</td><td>Italian</td><td>$12</td></tr>
        <tr><td>Paneer Tikka</td><td>Indian</td><td>$10</td></tr>
        </tbody>
    </table>

    <!-- Chef Special -->
    <h3 class="mt-4">Chef's Specials</h3>
    <ul class="list-group mb-4">
        <li class="list-group-item">Tandoori Chicken</li>
        <li class="list-group-item">Butter Naan</li>
    </ul>

    <figure class="text-center">
        <img src="https://via.placeholder.com/400" class="img-fluid">
        <figcaption class="lead mt-2">Our Signature Dish</figcaption>
    </figure>
</div>

</body>
</html>
