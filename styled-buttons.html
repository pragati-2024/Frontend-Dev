<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Styled Button Collection</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#f8fafc;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.container{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
  align-items:center;
}
button{
  padding:10px 20px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  transition:all 0.3s ease;
  box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

/* Primary Button */
.primary{
  background:#2563eb;
  color:white;
}
.primary:hover{
  background:#1e40af;
}
.primary:active{
  background:#1e3a8a;
}

/* Secondary Button */
.secondary{
  background:#10b981;
  color:white;
}
.secondary:hover{
  background:#059669;
}
.secondary:active{
  background:#047857;
}

/* Outline Button */
.outline{
  background:transparent;
  border:2px solid #2563eb;
  color:#2563eb;
}
.outline:hover{
  background:#2563eb;
  color:white;
}
.outline:active{
  background:#1e3a8a;
  border-color:#1e3a8a;
}

/* Disabled Button */
.disabled{
  background:#d1d5db;
  color:#6b7280;
  cursor:not-allowed;
}
button:disabled{
  opacity:0.6;
}

/* Focus state */
button:focus{
  outline:3px solid #93c5fd;
  outline-offset:2px;
}
</style>
</head>
<body>
<div class="container">
  <button class="primary">Primary</button>
  <button class="secondary">Secondary</button>
  <button class="outline">Outline</button>
  <button class="disabled" disabled>Disabled</button>
</div>
</body>
</html>
