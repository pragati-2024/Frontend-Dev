<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Iframes Example (Without extra files)</title>
</head>
<body>
  <h2>Introduction Page</h2>
  <iframe 
    srcdoc="<p>Hello! My name is Pragati. I am learning web development and exploring HTML iframes.</p>" 
    width="600" height="200" title="Intro">
  </iframe>

  <h2>My Hobby Page</h2>
  <iframe 
    srcdoc="<p>My favorite hobby is painting and listening to music 🎨🎧.</p>" 
    width="600" height="200" title="Hobby">
  </iframe>
</body>
</html>
