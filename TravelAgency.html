<!DOCTYPE html>
<html>
<head>
    <title>Travel Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <!-- Carousel -->
    <div id="travel" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active" data-bs-interval="2000">
                <img src="https://via.placeholder.com/900x400" class="d-block w-100">
                <div class="carousel-caption">
                    <h3>Paris</h3>
                </div>
            </div>

            <div class="carousel-item" data-bs-interval="2000">
                <img src="https://via.placeholder.com/900x400/aaa" class="d-block w-100">
                <div class="carousel-caption">
                    <h3>Maldives</h3>
                </div>
            </div>

            <div class="carousel-item" data-bs-interval="2000">
                <img src="https://via.placeholder.com/900x400/ccc" class="d-block w-100">
                <div class="carousel-caption">
                    <h3>New York</h3>
                </div>
            </div>

        </div>

        <button class="carousel-control-prev" data-bs-target="#travel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" data-bs-target="#travel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- Progress Bar -->
    <div class="progress mt-4">
        <div class="progress-bar progress-bar-striped progress-bar-animated"
             style="width:70%;">70% Booked</div>
    </div>

    <footer class="text-center mt-4">
        <p>Contact us: travel@example.com</p>
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
