<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator (HTML + CSS only)</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #141e30, #243b55);
    }

    .calculator {
      background: #1f2937;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.4);
      width: 260px;
    }

    input {
      width: 100%;
      height: 60px;
      border: none;
      background: #111827;
      color: white;
      font-size: 24px;
      text-align: right;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #374151;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #4b5563;
    }

    .equal {
      background: #9333ea;
    }

    .equal:hover {
      background: #a855f7;
    }
  </style>
</head>

<body>
  <div class="calculator">
    <input type="text" placeholder="0" readonly>

    <div class="buttons">
      <button>C</button>
      <button>DEL</button>
      <button>%</button>
      <button>/</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>*</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>-</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>+</button>

      <button>0</button>
      <button>.</button>
      <button class="equal">=</button>
    </div>
  </div>
</body>
</html>
