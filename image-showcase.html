<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Showcase Layout</title>
<style>
body{

  
  font-family: Arial, sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:40px;
}
h2{text-align:center;color:#1e3a8a;margin-bottom:30px;}

.gallery{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap:20px;
  justify-items:center;
}
figure{
  position:relative;
  overflow:hidden;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
  margin:0;
  background:#000;
  transition:transform 0.3s ease-in-out;
}
figure img{
  width:100%;
  height:200px;
  object-fit:cover;
  display:block;
  transition:transform 0.3s ease-in-out, opacity 0.3s;
}
figure::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.3);
  opacity:0;
  transition:opacity 0.3s ease-in-out;
}
figure:hover img{
  transform:scale(1.1);
}
figure:hover::after{
  opacity:1;
}
figcaption{
  text-align:center;
  padding:10px;
  background:#fff;
  border-radius:0 0 12px 12px;
  font-weight:bold;
  color:#1e3a8a;
}
</style>
</head>
<body>
<h2>Responsive Image Showcase</h2>
<div class="gallery">
  <figure>
    <img src="https://picsum.photos/id/1011/400/250" alt="Nature 1">
    <figcaption>Mountain View</figcaption>
  </figure>
  <figure>
    <img src="https://picsum.photos/id/1025/400/250" alt="Nature 2">
    <figcaption>Golden Retriever</figcaption>
  </figure>
  <figure>
    <img src="https://picsum.photos/id/1040/400/250" alt="Nature 3">
    <figcaption>Calm Lake</figcaption>
  </figure>
  <figure>
    <img src="https://picsum.photos/id/1060/400/250" alt="Nature 4">
    <figcaption>Sunset Horizon</figcaption>
  </figure>
  <figure>
    <img src="https://picsum.photos/id/1074/400/250" alt="Nature 5">
    <figcaption>Forest Path</figcaption>
  </figure>
  <figure>
    <img src="https://picsum.photos/id/1080/400/250" alt="Nature 6">
    <figcaption>Beach Walk</figcaption>
  </figure>
</div>
</body>
</html>
