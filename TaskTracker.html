<!DOCTYPE html>
<html>
<head>
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">
    <h2>Tasks <span class="badge bg-danger">5</span></h2>

    <ul class="list-group mt-3">
        <li class="list-group-item d-flex justify-content-between">
            Complete Project <span class="badge bg-danger">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between">
            Study Bootstrap <span class="badge bg-warning">Medium</span>
        </li>
        <li class="list-group-item d-flex justify-content-between">
            Buy Groceries <span class="badge bg-success">Low</span>
        </li>
    </ul>

    <button class="btn btn-primary mt-4">
        Completed <span class="badge bg-light text-dark">2</span>
    </button>
</div>

</body>
</html>
