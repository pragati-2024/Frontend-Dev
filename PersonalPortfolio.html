<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">

<div class="container text-center mt-4">
    <h1 class="fw-bold">Pragati Bansal</h1>
    <p class="lead">Frontend Developer & Designer</p>

    <img src="https://via.placeholder.com/150"
         class="img-fluid rounded-circle mt-3"
         style="width:150px; height:150px;">

    <div class="mt-4">
        <button class="btn btn-primary me-2">Hire Me</button>
        <button class="btn btn-outline-dark">Download CV</button>
    </div>

    <!-- Contact Form -->
    <div class="mt-5 mx-auto" style="max-width:400px;">
        <input type="text" class="form-control mb-3" placeholder="Your Name">
        <input type="email" class="form-control mb-3" placeholder="Email">
        <textarea class="form-control mb-3" placeholder="Message"></textarea>
        <button class="btn btn-success w-100">Send</button>
    </div>
</div>

</body>
</html>
