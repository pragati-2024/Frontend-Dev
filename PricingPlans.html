<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .price:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="row text-center">

        <!-- Basic -->
        <div class="col-md-4 mb-4">
            <div class="card p-4 shadow-lg price">
                <h3>Basic</h3>
                <h2>$10</h2>
                <p>3 Features included.</p>
            </div>
        </div>

        <!-- Pro Highlighted -->
        <div class="col-md-4 mb-4">
            <div class="card p-4 bg-primary text-white shadow-lg price">
                <h3>Pro</h3>
                <h2>$20</h2>
                <p>Everything in Basic + 3 more.</p>
            </div>
        </div>

        <!-- Premium -->
        <div class="col-md-4 mb-4">
            <div class="card p-4 shadow-lg price">
                <h3>Premium</h3>
                <h2>$30</h2>
                <p>All features unlocked.</p>
            </div>
        </div>

    </div>
</div>

</body>
</html>
