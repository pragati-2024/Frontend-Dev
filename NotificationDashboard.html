<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <div class="card p-4">

        <div class="alert alert-success">✔ New message received!</div>

        <div class="alert alert-info">ℹ Here are some helpful tips.</div>

        <div class="alert alert-danger">⚠ Warning! Action required.</div>

        <div class="alert alert-warning alert-dismissible fade show">
            This is a dismissible alert.
            <button class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="bg-light p-4 border mt-3">
            <h5>Summary</h5>
            <p>You have 3 new notifications.</p>
        </div>

    </div>

</div>
</body>
</html>
