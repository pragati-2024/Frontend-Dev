<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Photo Gallery Grid</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
    body{background:#f3f6f8;padding:2rem}
    .gallery {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap:16px;
      max-width:1200px;
      margin:0 auto;
    }

    figure {
      margin:0;
      overflow:hidden;
      border-radius:8px;
      background:#fff;
      box-shadow:0 6px 18px rgba(0,0,0,0.06);
      display:flex;
      flex-direction:column;
    }

    figure img {
      width:100%;
      height:220px;
      object-fit:cover;
      display:block;
      transition: transform 0.5s ease;
      will-change: transform;
    }

    figure:hover img {
      transform: scale(1.08);
    }

    figcaption {
      padding:0.75rem 1rem;
      font-size:0.95rem;
      color:#333;
    }

    @media (max-width:420px){
      figure img { height:160px; }
    }
  </style>
</head>
<body>
  <main class="gallery" aria-label="Photo gallery">
    <figure>
      <img src="https://via.placeholder.com/800x600?text=Photo+1" alt="Photo 1">
      <figcaption>Caption for Photo 1</figcaption>
    </figure>

    <figure>
      <img src="https://via.placeholder.com/800x600?text=Photo+2" alt="Photo 2">
      <figcaption>Caption for Photo 2</figcaption>
    </figure>

    <figure>
      <img src="https://via.placeholder.com/800x600?text=Photo+3" alt="Photo 3">
      <figcaption>Caption for Photo 3</figcaption>
    </figure>

    <figure>
      <img src="https://via.placeholder.com/800x600?text=Photo+4" alt="Photo 4">
      <figcaption>Caption for Photo 4</figcaption>
    </figure>

    <figure>
      <img src="https://via.placeholder.com/800x600?text=Photo+5" alt="Photo 5">
      <figcaption>Caption for Photo 5</figcaption>
    </figure>

    <figure>
      <img src="https://via.placeholder.com/800x600?text=Photo+6" alt="Photo 6">
      <figcaption>Caption for Photo 6</figcaption>
    </figure>
  </main>
</body>
</html>
