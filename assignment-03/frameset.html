<!DOCTYPE html>
<html>
<head>
  <title>Frameset Example (Single File)</title>
</head>

<frameset rows="20%,80%">
  <!-- Top frame -->
  <frame 
    srcdoc="<a href='#'>Home</a> | <a href='#'>About</a> | <a href='#'>Contact</a>" 
    name="topFrame">
  
  <!-- Bottom frame -->
  <frame 
    srcdoc="<h2>Welcome to My Website</h2>" 
    name="bottomFrame">
</frameset>

</html>
