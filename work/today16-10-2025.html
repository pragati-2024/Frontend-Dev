<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    div {
      box-sizing: border-box;
      background-color: yellow;
      color: white;
      width: 300px;
      height: 300px;
      border-radius: 10rem;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .eye {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 4rem;
      margin-left: 3rem;
      gap: 3rem;
      background-color: yellow;
      width: 200px;
    }
    .eyes {
      box-sizing: border-box;
      background-color: black;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 10rem;
    }
    .eyes1 {
      box-sizing: border-box;
      background-color: white;
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 10rem;
      margin-left: 2rem;
      margin-top: 1rem;
    }
    .rectangle{
        background-color: red;
        border-radius: 0px 0px 85px 85px;
        height: 75px;
        width: 200px;
        margin-top: 3rem;
        margin-left: 3rem;
        border: 1px solid black;

    }
  </style>
  <body>
    <div>
      <section class="eye">
        <div class="eyes">
          <div class="eyes1"></div>
        </div>
        <div class="eyes">
            <div class="eyes1"></div>
        </div>
      </section>
      <div class="rectangle">

      </div>
    </div>
  </body>
</html>
