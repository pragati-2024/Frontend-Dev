<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Course Registration</title></head>
<body>
  <h1>Course Registration</h1>

  <form>
    <fieldset>
      <legend>Student Details</legend>
      <label>Name: <input type="text" name="name" required></label><br><br>
      <label>Email: <input type="email" name="email" required></label>
    </fieldset>

    <fieldset>
      <legend>Course Selection</legend>
      <label for="course">Choose Course:</label>
      <select id="course" name="course" required>
        <option value="" disabled selected>Select Course</option>
        <option>Web Development</option>
        <option>Data Science</option>
        <option>UI/UX</option>
      </select>
    </fieldset>

    <button type="submit">Register</button>
  </form>

  <h2>Available Schedules</h2>
  <table border="1">
    <tr><th>Day</th><th>Time</th><th>Instructor</th></tr>
    <tr><td>Mon & Wed</td><td>6:00pm - 8:00pm</td><td>Mr. Sharma</td></tr>
    <tr><td>Sat</td><td>10:00am - 1:00pm</td><td>Ms. Verma</td></tr>
  </table>
</body>
</html>
